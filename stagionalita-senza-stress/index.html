<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stagionalità finanziarie ordinate per affidabilità statistica, con il backtest del Metodo C2. Non è un servizio di segnali di trading.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Stagionalità Senza Stress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
/* Layout: header sottile + contenuto a colonna unica (max 1120px); card a griglia; dettaglio con tre numeri chiave in alto. Palette e font ripresi da Forecaster Terminal. */
:root{
  --bg:#ffffff; --surface:#ffffff; --muted:#f5f7fa; --border:#e5e5e5;
  --fg:#09090b; --fg-2:#3f4a5c; --fg-3:#737373;
  --navy:#1e2d4d; --navy-2:#263f5f; --navy-3:#2e4f6f; --blue:#549be2; --blue-2:#68aaed; --blue-soft:#eff7ff;
  --hero-fg:#ffffff; --hero-sub:#c9d8ec; --brand:#1e2d4d; --heading:#2e4f6f;
  --long:#15803d; --long-soft:#ecfdf3; --long-line:#bbf0cf;
  --short:#c2121f; --short-soft:#fff1f2; --short-line:#fecdd3;
  --warn:#c2410c; --warn-soft:#fff7ed;
  --font:"Roboto Flex","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:.625rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#171717; --muted:#202226; --border:#ffffff1a;
  --fg:#fafafa; --fg-2:#c8ced8; --fg-3:#a1a1a1;
  --navy:#1a2740; --navy-2:#24364f; --navy-3:#2e4f6f; --blue:#68aaed; --blue-2:#8cc0f3; --blue-soft:#14243a;
  --hero-fg:#ffffff; --hero-sub:#a9bdd6; --brand:#fafafa; --heading:#8cc0f3;
  --long:#4ade80; --long-soft:#0d2a1a; --long-line:#1f5c37;
  --short:#ff6b74; --short-soft:#32121a; --short-line:#6b2230;
  --warn:#fb923c; --warn-soft:#2f1a0c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#171717; --muted:#202226; --border:#ffffff1a;
  --fg:#fafafa; --fg-2:#c8ced8; --fg-3:#a1a1a1;
  --navy:#1a2740; --navy-2:#24364f; --navy-3:#2e4f6f; --blue:#68aaed; --blue-2:#8cc0f3; --blue-soft:#14243a;
  --hero-fg:#ffffff; --hero-sub:#a9bdd6; --brand:#fafafa; --heading:#8cc0f3;
  --long:#4ade80; --long-soft:#0d2a1a; --long-line:#1f5c37;
  --short:#ff6b74; --short-soft:#32121a; --short-line:#6b2230;
  --warn:#fb923c; --warn-soft:#2f1a0c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em;font-stretch:112%;color:var(--brand);white-space:nowrap}
@media (max-width:520px){.brand{flex:1}.brand-name{font-size:15px;white-space:normal;line-height:1.15;display:block}.brand-sub{display:none}.nav a{padding:6px 10px}}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.nav{display:flex;gap:6px}
.nav a{padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--fg-2)}
.nav a:hover{background:var(--muted)}
.nav a[aria-current="page"]{background:var(--blue-2);color:#fff}
@media (max-width:420px){.nav{gap:2px}.nav a{padding:6px 8px;font-size:13px}}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:24px}

/* Hero */
.hero{background:var(--navy);color:var(--hero-fg);border-radius:calc(var(--radius)*1.6);padding:28px;display:grid;gap:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.hero .eyebrow{color:var(--blue-2)}
.hero h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.12;font-weight:700;font-stretch:110%;letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
.hero p{margin:0;color:var(--hero-sub);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--navy-2);border:1px solid #ffffff1f;border-radius:var(--radius);padding:12px 14px;text-align:left;cursor:pointer;color:var(--hero-fg)}
.tile:hover{border-color:var(--blue-2)}
.tile[aria-pressed="true"]{border-color:var(--blue-2);box-shadow:inset 0 0 0 1px var(--blue-2)}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-sub)}
.tile .v{font-size:28px;font-weight:700;line-height:1.1}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 14px;background:var(--surface)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;color:var(--fg-2)}
.pill-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
select.sel{border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--blue)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.updated{font-size:12px;color:var(--fg-3)}
/* Filtri Radar */
.btn.f-on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn .fcount{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blue-2);color:#fff;font-size:11px}
.fpanel{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 16px;align-items:end}
.fgrp{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgrp>span{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.02em}
.fgrp select.sel{width:100%}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fcounter{font-size:13px;color:var(--fg-3);margin:2px 2px -4px}
.fcounter b{color:var(--fg);font-weight:700}
.factions{display:flex;justify-content:flex-end;align-items:end;grid-column:-2/-1}
@media (max-width:640px){.fpanel{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}.factions{grid-column:1/-1;justify-content:stretch}.factions .btn{width:100%;justify-content:center}}

/* Badges */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);white-space:nowrap}
.cls-S{background:var(--navy);color:#fff;border-color:var(--navy)}
.cls-Ap{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.cls-A{background:var(--muted);color:var(--fg-2);border-color:transparent}
.st-ATTIVA{background:var(--long-soft);color:var(--long);border-color:var(--long-line)}
.st-ARRIVO{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.st-TERMINATA{background:var(--muted);color:var(--fg-3);border-color:transparent}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dir{display:inline-flex;align-items:center;gap:5px;font-weight:700;letter-spacing:.03em}
.dir.long{color:var(--long)} .dir.short{color:var(--short)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);padding:16px;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--blue-2);transform:translateY(-1px)}
/* Stagionalità ATTIVA: cornice blu e sfondo azzurro chiaro (stesso blu del riquadro selezionato in alto) */
.card.is-active{border-color:var(--blue-2);background:var(--blue-soft)}
.card.is-active .kpi,.card.is-active .bar{background:var(--surface)}
.card.is-active .card-foot{border-top-color:var(--blue-2)}
.period.is-active{border-color:var(--blue-2);background:var(--blue-soft)}
.period.is-active .bar{background:var(--surface)}
/* Esito R del trade chiuso */
.res-pos{background:var(--long-soft);color:var(--long);border-color:var(--long-line)}
.res-neg{background:var(--short-soft);color:var(--short);border-color:var(--short-line)}
.res-be{background:var(--muted);color:var(--fg-2);border-color:var(--border)}
.res-pos-txt{color:var(--long)} .res-neg-txt{color:var(--short)} .res-be-txt{color:var(--fg)}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid;border-radius:var(--radius);padding:9px 12px}
.res .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.85}
.res .v{font-size:20px;font-weight:800;letter-spacing:-.01em}
.res.big{padding:16px 20px;border-radius:calc(var(--radius)*1.6)}
.res.big .v{font-size:clamp(28px,4vw,38px)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.asset-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.asset{font-size:18px;font-weight:700;font-stretch:108%}
.tk{font-size:13px;font-weight:500;color:var(--fg-3)}
.sub{font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sub span{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--muted);border-radius:var(--radius);padding:8px 10px}
.kpi .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.kpi .v{font-size:17px;font-weight:700}
.bar{height:6px;background:var(--muted);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue-2);border-radius:99px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-3);margin-bottom:5px}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:1px solid var(--border);padding-top:10px;color:var(--fg-3)}
.card-foot b{color:var(--fg)}
.card-foot .go{color:var(--blue);font-weight:600}

/* Classe statistica (badge grande) */
.cbig{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);font-weight:800;line-height:1;font-stretch:112%;letter-spacing:-.02em}
.cbig small{font-size:10px;letter-spacing:.12em;font-weight:600;margin-top:6px;opacity:.8}
.cbig.cls-S{background:var(--navy);color:#fff}
.cbig.cls-Ap{background:var(--blue-soft);color:var(--blue)}
.cbig.cls-A{background:var(--muted);color:var(--fg-2)}
.cwrap{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:8px;cursor:help;flex:none}
.ctip{position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:280px;max-width:calc(100vw - 48px);background:var(--surface);color:var(--fg-2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px #0000002e;padding:12px 14px;font-size:12.5px;line-height:1.45;text-align:left;font-weight:400;letter-spacing:0;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s,transform .12s,visibility .12s;pointer-events:none}
.cwrap:hover .ctip,.cwrap:focus .ctip,.cwrap:focus-within .ctip{opacity:1;visibility:visible;transform:none}
.ctip b{display:block;color:var(--fg);font-size:13px;margin-bottom:6px}
.ctip ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:3px}
.ctip li{color:var(--fg-3)}
.ctip li.on{color:var(--fg);font-weight:700}
.ctip p{margin:0;font-size:11.5px;color:var(--fg-3);border-top:1px solid var(--border);padding-top:7px}
.card:hover{position:relative;z-index:5}
@media (prefers-reduced-motion:reduce){.ctip{transition:none}}

/* States */
.notice{border:1px solid var(--border);background:var(--muted);border-radius:var(--radius);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.notice p{margin:0;max-width:70ch}
.notice.err{background:var(--short-soft);border-color:var(--short-line)}
.empty{color:var(--fg-3);text-align:center;padding:32px 0}
.skel{height:190px;border-radius:calc(var(--radius)*1.4);background:linear-gradient(90deg,var(--muted),var(--surface),var(--muted));background-size:200% 100%;animation:sh 1.4s linear infinite;border:1px solid var(--border)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.card{transition:none}}

/* Detail */
.back{color:var(--blue);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.dhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dhead h1{margin:0;font-size:clamp(28px,4.4vw,42px);font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1}
.dhead .nm{color:var(--fg-3);font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px}
.key{border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);padding:20px 22px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.key .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.key.dir-long{background:var(--long-soft);border-color:var(--long-line)}
.key.dir-short{background:var(--short-soft);border-color:var(--short-line)}
.big-dir{font-size:clamp(38px,6vw,60px);font-weight:900;font-stretch:118%;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:10px}
.big-avg{font-size:clamp(38px,6vw,60px);font-weight:800;line-height:1;letter-spacing:-.02em}
.key .s{font-size:13px;color:var(--fg-2)}
.c-long{color:var(--long)} .c-short{color:var(--short)}
.period{display:grid;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.period .prow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg-2)}
@media (max-width:760px){.keys{grid-template-columns:1fr 1fr}.keys .key-score{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}}
@media (max-width:420px){.keys{grid-template-columns:1fr}}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--heading);font-weight:700}
.sec-h .hint{font-size:13px;color:var(--fg-3)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mini{background:var(--muted);border-radius:var(--radius);padding:8px 12px}
.mini .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.mini .v{font-size:15px;font-weight:700}
.mini .v.neg{color:var(--short)}
.mini .ms{font-size:11.5px;color:var(--fg-3)}
.minis.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.minis.m4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{font-size:13px;color:var(--fg-3);margin:0;max-width:90ch}

/* Backtest */
.bt{border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);overflow:hidden;background:var(--surface)}
.bt-head{background:var(--navy);color:var(--hero-fg);padding:22px;display:grid;gap:12px}
.bt-wr .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-sub);font-weight:600}
.bt-wr .v{font-size:clamp(52px,9vw,80px);font-weight:900;font-stretch:115%;line-height:1}
.bt-wr .s{font-size:13px;color:var(--hero-sub)}
.bt-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;max-width:820px;margin:0 auto;min-width:480px;height:auto}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{border-left:3px solid var(--blue-2);padding:2px 0 2px 12px;font-size:13.5px;color:var(--fg-2)}
.rule b{display:block;color:var(--fg);font-size:13px;letter-spacing:.04em;text-transform:uppercase}

/* Trade steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px}
.step.on .dot{background:var(--long);border-color:var(--long);color:#fff}
.step b{display:block;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.step span{font-size:13.5px;color:var(--fg-3)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* Calendar */
.cal-hero{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);padding:18px 20px}
.cal-hero h1{margin:0;font-size:26px;font-weight:800;font-stretch:110%}
.cal-hero p{margin:0;color:var(--fg-3)}
.month{display:flex;flex-direction:column;gap:8px}
.month-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.month-h::after{content:"";flex:1;height:1px;background:var(--border)}
.row{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
.row:hover{border-color:var(--blue-2)}
.date{flex:none;width:52px;text-align:center;border-radius:8px;background:var(--blue-soft);padding:6px 0;line-height:1.1}
.date small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
.date b{font-size:20px}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--fg-3);align-items:center}
.row .sc{flex:none;text-align:right;font-size:12px;color:var(--fg-3)}
.row .sc b{display:block;font-size:20px;color:var(--fg)}

.tv-slot{height:clamp(380px,62vh,620px);border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);overflow:hidden;background:var(--surface)}
.tv-slot>div{height:100%}
.tv-slot{position:relative}
.ch-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--fg-2);font-size:14px}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--fg-2)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.ch-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--blue)}
.disc{border-top:1px solid var(--border);padding-top:18px;font-size:13px;color:var(--fg-3)}
.disc b{color:var(--fg-2)}
.disc p{margin:4px 0 0;max-width:90ch}

/* Home: presentazione e percorso Academy → Radar → Calendario */
.home-hero h1{max-width:18ch}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cta{display:inline-flex;align-items:center;border-radius:999px;padding:10px 20px;font-weight:600;font-size:15px;border:1px solid #ffffff40;color:var(--hero-fg)}
.cta:hover{border-color:var(--blue-2)}
.cta.primary{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.cta.primary:hover{background:var(--blue)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:f}
@media (max-width:820px){.flow{grid-template-columns:1fr}}
.flow-step{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);padding:20px;background:var(--surface);transition:border-color .15s,transform .15s}
.flow-step:hover{border-color:var(--blue-2);transform:translateY(-1px)}
.flow-top{display:flex;justify-content:space-between;align-items:center}
.flow-n{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--blue)}
.flow-n::before{content:"PASSO "}
.flow-ico{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.flow-step h3{margin:0;font-size:20px;font-weight:700;font-stretch:108%;letter-spacing:-.01em}
.flow-step p{margin:0;color:var(--fg-2);font-size:14px;flex:1}
.flow-step .go,.sec-h .go{color:var(--blue);font-weight:600;font-size:14px}
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.feats{grid-template-columns:1fr}}
.feat{border-left:3px solid var(--blue-2);background:var(--muted);border-radius:0 var(--radius) var(--radius) 0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feat b{font-size:14px}
.feat span{font-size:13px;color:var(--fg-2)}
@media (prefers-reduced-motion:reduce){.flow-step{transition:none}}
@media (max-width:480px){.brand>span{display:none}}

/* Academy: lettore a sinistra, elenco lezioni a destra (impilati su mobile) */
.ac-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.ac-tiles .tile{cursor:default}
.ac-tiles .tile:hover{border-color:#ffffff1f}
@media (max-width:640px){.ac-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.ac-tiles .tile .v{font-size:22px}}
.ac{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.ac{grid-template-columns:1fr}}
.ac-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.player{position:relative;aspect-ratio:16/9;border-radius:calc(var(--radius)*1.6);overflow:hidden;background:var(--navy);border:1px solid var(--border)}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--hero-sub);text-align:center;padding:20px;background:radial-gradient(120% 90% at 50% 0%,var(--navy-3),var(--navy))}
.player-ph .ring{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff33;display:flex;align-items:center;justify-content:center}
.player-ph b{color:var(--hero-fg);font-size:16px}
.player-ph span{font-size:13px}
.ac-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--fg-3)}
.ac-main h1{margin:0;font-size:clamp(24px,3.4vw,32px);font-weight:800;font-stretch:110%;letter-spacing:-.02em;line-height:1.12}
.ac-main .lead{margin:0;color:var(--fg-2);max-width:68ch}
.learn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.learn li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg-2)}
.learn li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--blue-2);margin-top:8px}
.ac-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--border);padding-top:14px}
.ac-nav a{display:flex;flex-direction:column;gap:2px;max-width:48%;font-size:14px;font-weight:600;color:var(--blue)}
.ac-nav a small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.ac-nav a.nx{text-align:right;margin-left:auto}
.ac-side{border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);background:var(--surface);overflow:hidden;position:sticky;top:76px}
@media (max-width:900px){.ac-side{position:static}}
.ac-side-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ac-side-h h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--heading);font-weight:700}
.ac-side-h span{font-size:12px;color:var(--fg-3)}
.lessons{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px}
.lesson{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--radius)}
.lesson:hover{background:var(--muted)}
.lesson[aria-current="page"]{background:var(--blue-soft)}
.lesson .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--muted);color:var(--fg-2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lesson[aria-current="page"] .n{background:var(--blue-2);color:#fff}
.lesson .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lesson .t b{font-size:14px;font-weight:600;line-height:1.3}
.lesson .t span{font-size:12px;color:var(--fg-3)}
</style>

<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";
const API = "/api/data";
/* Simboli TradingView: aggiungi qui gli asset nuovi (nome come nella colonna "Asset" del diario). */
const TV_SYMBOLS = {

  "AAPL":"NASDAQ:AAPL","AMZN":"NASDAQ:AMZN","AVGO":"NASDAQ:AVGO","GOOG":"NASDAQ:GOOG","GOOGL":"NASDAQ:GOOGL",
  "META":"NASDAQ:META","MSFT":"NASDAQ:MSFT","NVDA":"NASDAQ:NVDA","TSLA":"NASDAQ:TSLA","MU":"NASDAQ:MU",

  "XAUUSD":"OANDA:XAUUSD","XAGUSD":"OANDA:XAGUSD","GOLD":"OANDA:XAUUSD","SILVER":"OANDA:XAGUSD",

  "PLATINUM":"IG:PLATINUM","PLUSD":"IG:PLATINUM",
  "PALLADIUM":"FOREXCOM:PALLADIUM","PAUSD":"FOREXCOM:PALLADIUM",

  "HGUSD":"IG:COPPER","COPPER":"IG:COPPER",
  "CLUSD":"IG:USOIL","CRUDE OIL":"IG:USOIL",
  "NGUSD":"IG:NATURALGAS","NATURAL GAS":"IG:NATURALGAS",

  "ZCUSX":"FOREXCOM:CORN","CORN":"FOREXCOM:CORN",
  "ZSUSX":"CAPITALCOM:SOYBEAN","SOYBEAN":"CAPITALCOM:SOYBEAN",
  "KEUSX":"CBOT:KE1!","ZWUSX":"FOREXCOM:WHEAT",

  "COCOA":"IG:NYCOCOA","CCUSX":"IG:NYCOCOA",
  "SUGAR":"IG:NYSUGARNO11","SBUSX":"IG:NYSUGARNO11",
  "COFFEE":"FOREXCOM:COFFEE","KCUSX":"FOREXCOM:COFFEE",
  "CTUSX":"FOREXCOM:COTTON","OJUSX":"CAPITALCOM:ORANGE",

  "S&P 500":"SP:SPX","SPX":"SP:SPX",
  "NASDAQ 100":"NASDAQ:NDX","NDX":"NASDAQ:NDX",
  "DAX 40":"XETR:DAX","DAX":"XETR:DAX",
  "^GSPC":"SP:SPX","^NDX":"NASDAQ:NDX","^GDAXI":"XETR:DAX",

  "BTCUSD":"BITSTAMP:BTCUSD","ETHUSD":"BITSTAMP:ETHUSD",

  "RUT":"IG:RUSSELL",
  "RUSSELL":"IG:RUSSELL",
  "RUSSELL 2000":"IG:RUSSELL",

  
};

  
const FUTURES_MAP = {
  "PLATINUM": "NYMEX:PL1!",
  "PLUSD": "NYMEX:PL1!",
  "PALLADIUM": "NYMEX:PA1!",
  "PAUSD": "NYMEX:PA1!",
  "HGUSD": "COMEX:HG1!",
  "COPPER": "COMEX:HG1!",
  "CLUSD": "NYMEX:CL1!",
  "CRUDE OIL": "NYMEX:CL1!",
  "NGUSD": "NYMEX:NG1!",
  "NATURAL GAS": "NYMEX:NG1!",
  "ZCUSX": "CBOT:ZC1!",
  "CORN": "CBOT:ZC1!",
  "ZSUSX": "CBOT:ZS1!",
  "SOYBEAN": "CBOT:ZS1!",
  "KEUSX": "CBOT:KE1!",
  "ZWUSX": "CBOT:ZW1!",
  "COCOA": "ICEUS:CC1!",
  "CCUSX": "ICEUS:CC1!",
  "SUGAR": "ICEUS:SB1!",
  "SBUSX": "ICEUS:SB1!",
  "COFFEE": "ICEUS:KC1!",
  "KCUSX": "ICEUS:KC1!",
  "CTUSX": "ICEUS:CT1!",
  "OJUSX": "ICEUS:OJ1!",
  "XAUUSD": "COMEX:GC1!", "GOLD": "COMEX:GC1!", "XAGUSD": "COMEX:SI1!", "SILVER": "COMEX:SI1!",
  "ALIUSD": "COMEX:ALI1!", "RBUSD": "NYMEX:RB1!", "HOUSD": "NYMEX:HO1!", "BZUSD": "NYMEX:BB1!",
  "GSPC": "CME_MINI:ES1!", "^GSPC": "CME_MINI:ES1!", "NDX": "CME_MINI:NQ1!", "^NDX": "CME_MINI:NQ1!",
  "DJI": "CBOT_MINI:YM1!", "RUT": "CME_MINI:RTY1!", "N225": "CME:NKD1!",
  "GDAXI": "XETR:DAX", "^GDAXI": "XETR:DAX", "STOXX50E": "TVC:SX5E", "SSMI": "SIX:SMI", "FTSE": "TVC:UKX", "FCHI": "EURONEXT:PX1"
};


  
function tvSymbol(asset){
  const a = String(asset || "").trim().toUpperCase();
  if (TV_SYMBOLS[a]) return TV_SYMBOLS[a];
  const fx = a.match(/^([A-Z]{3})\/?([A-Z]{3})$/);
  if (fx && !/^(XAU|XAG)/.test(a)) return "FX:" + fx[1] + fx[2];
  return a.replace(/\s+/g, "");
}
const STRATEGY = "Metodo C2";
const STRATEGY_LONG = "Metodo C2 · Doppia candela contraria";

const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MESI_L = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

const S = {
  diario: null, cal: null, loading: true, error: null, mcp: undefined,
  updatedAt: null,
  f: {status: "ATTIVA", q: "", classi: [], dir: "", tipo: "", wrMin: "", expMin: "", entro: "", sort: "classe"},
  fOpen: false
};
const F_DEF = {classi: [], dir: "", tipo: "", wrMin: "", expMin: "", entro: "", sort: "classe"};
try {
  const v3 = JSON.parse(localStorage.getItem("sss-filters-v3") || "null");
  const v2 = v3 ? null : JSON.parse(localStorage.getItem("sss-filters-v2") || "null");
  if (v3) Object.keys(F_DEF).forEach(k => { if (k in v3) S.f[k] = v3[k]; });
  else if (v2 && v2.classe) S.f.classi = [v2.classe];
  if (!Array.isArray(S.f.classi)) S.f.classi = [];
} catch(e) {}

/* ---------- parsing ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(v){
  if (v == null) return null;
  let s = String(v).trim();
  if (!s) return null;
  if (s.includes("∞")) return Infinity;
  s = s.replace(/[%Rx\s]/g, "").replace(/^\+/, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function pdate(s){
  const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
const truthy = v => v === true || String(v).toUpperCase() === "TRUE";
const fmtPct = (n, d=1) => n == null ? "—" : n === Infinity ? "∞" : n.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const fmtN = (n, d=2) => n == null ? "—" : n === Infinity ? "∞" : n.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtR = n => n == null ? "—" : (n > 0 ? "+" : "") + n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}) + "R";
const dShort = d => d ? d.getDate().toString().padStart(2,"0") + " " + MESI[d.getMonth()] : "—";
const dLong = d => d ? d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";

function wrWindow(years, n){
  const i = years.findIndex(y => y.r != null);
  if (i < 0) return null;
  const win = years.slice(i, i + n);
  const trades = win.filter(y => y.r != null);
  const wins = trades.filter(y => y.r > 0).length;
  return {pct: trades.length ? wins / trades.length * 100 : null, wins, n: trades.length,
          from: win[win.length-1].y, to: win[0].y};
}

function build(){
  if (!S.diario) return [];
  const rows = S.diario;
  const head = (rows[0] || []).map(h => String(h || "").trim());
  const ix = {}; head.forEach((h, i) => { if (h && !(h in ix)) ix[h] = i; });
  const yearCols = head.map((h, i) => { const m = h.match(/^(\d{4})\s*\(R\)$/); return m ? {y: +m[1], i} : null; })
                       .filter(Boolean).sort((a, b) => b.y - a.y);
  const calMap = {};
  if (S.cal && S.cal.length){
    let hr = S.cal.findIndex(r => r.some(c => String(c).trim() === "ID"));
    if (hr >= 0){
      const ch = S.cal[hr].map(h => String(h || "").trim());
      const ci = n => ch.indexOf(n);
      S.cal.slice(hr + 1).forEach(r => {
        const id = String(r[ci("ID")] || "").trim();
        if (!id) return;
        calMap[id] = {c1: truthy(r[ci("Prima candela opposta")]), trig: truthy(r[ci("Trigger confermato")]), chiuso: truthy(r[ci("Chiuso")])};
      });
    }
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  rows.slice(1).forEach(r => {
    const g = h => ix[h] == null ? "" : r[ix[h]];
    const id = String(g("ID") || "").trim();
    const asset = String(g("Asset") || "").trim();
    if (!id || !asset) return;
    if (/^NO/i.test(String(g("PUBBLICA SUL SITO") || "").trim())) return; // short e forex restano solo nel diario
    const periodo = String(g("Periodo stagionale") || "");
    const parts = periodo.split("-").map(s => s.trim());
    const start = pdate(parts[0]), end = pdate(parts[1]);
    let status = "IN ARRIVO", progress = 0;
    if (start && end){
      if (today > end){ status = "TERMINATA"; progress = 100; }
      else if (today >= start){ status = "ATTIVA"; progress = Math.max(0, Math.min(100, (today - start) / (end - start) * 100)); }
    }
    // Colonna "Esito R" compilata = trade chiuso (TP, SL o chiusura anticipata): la stagionalità diventa TERMINATA
    const esitoRTxt = String(g("Esito R") || "").trim();
    if (esitoRTxt){ status = "TERMINATA"; progress = 100; }
    const years = yearCols.map(c => ({y: c.y, r: num(r[c.i])}));
    const cal = calMap[id] || {c1:false, trig:false, chiuso:false};
    const esito = String(g("ESITO (WIN/LOSS/BE)") || "").trim();
    out.push({
      id, asset, nome: String(g("Nome") || "").trim(), periodo, start, end, status, progress,
      dir: String(g("Direzione") || "").toUpperCase().includes("SHORT") ? "SHORT" : "LONG",
      avg: num(g("AVG Medio")), wr10: num(g("WR 10Y")), wr20: num(g("WR 20Y")),
      avg10: num(g("AVG 10Y")), avg20: num(g("AVG 20Y")), avgOpp: num(g("AVG Opposto")),
      ddMed: num(g("DD Medio")), ddMin: num(g("DD Min")), ddMax: num(g("DD Max")),
      avgRatio: num(g("AVG Ratio")), vp: num(g("Rapporto V/P Medio")),
      classe: String(g("Classe") || "").trim(),
      tipo: String(g("TIPO ASSET") || "").trim(),
      trigDate: String(g("Data Trigger") || "").trim(), c1Date: String(g("Data 1ª Candela") || "").trim(),
      entry: String(g("Entry") || "").trim(),
      tp: String(g("TP") || "").trim(), sl: String(g("SL") || "").trim(), rr: num(g("R:R")),
      esitoR: num(esitoRTxt), esitoRTxt, chiusura: String(g("Data Chiusura") || "").trim(), esito,
      durata: num(g("Durata Stagionalità")),
      note: String(g("Note") || "").trim(),
      bt: {
        wr: num(g("WR backtest (trade chiusi)")), exp: num(g("Expectancy (R medio per trade)")),
        pf: num(g("Profit Factor (R vinti / R persi)")), score: num(g("SCORE BACKTEST (0-100)")),
        prio: String(g("PRIORITÀ BACKTEST (da score)") || "").trim(),
        years, wr5: wrWindow(years, 5), wr10: wrWindow(years, 10)
      },
      // Stato del trade dal Diario (compilato dal bot), con il Calendario come riserva.
      // Ogni passo successivo implica i precedenti: chiuso ⇒ trigger ⇒ 1ª candela.
      flags: (() => {
        const chiuso = cal.chiuso || !!esito || !!esitoRTxt;
        const trig = chiuso || cal.trig || !!String(g("Data Trigger") || "").trim() || !!String(g("Entry") || "").trim();
        const c1 = trig || cal.c1 || !!String(g("Data 1ª Candela") || "").trim();
        return {c1, trig, chiuso};
      })()
    });
  });
  return out;
}

/* ---------- small components ---------- */
const clsTag = c => c ? `<span class="tag ${c === "S" ? "cls-S" : c === "A+" ? "cls-Ap" : "cls-A"}" title="Classe statistica">${esc(c === "S" || c.startsWith("A") ? "Classe " + c : c)}</span>` : "";
const stTag = s => `<span class="tag ${s === "ATTIVA" ? "st-ATTIVA" : s === "TERMINATA" ? "st-TERMINATA" : "st-ARRIVO"}">${s}</span>`;
/* Esito R: verde se positivo, rosso se negativo, neutro se zero o testo */
const esitoCls = it => it.esitoR == null || it.esitoR === 0 ? "res-be" : it.esitoR > 0 ? "res-pos" : "res-neg";
const esitoTxt = it => it.esitoR != null ? fmtR(it.esitoR) : esc(it.esitoRTxt);
const stTagIt = (it, short) => it.status === "TERMINATA" && it.esitoRTxt
  ? `<span class="tag ${esitoCls(it)}">TERMINATA${short ? "" : " · " + esitoTxt(it)}</span>` : stTag(it.status);
function esitoBox(it, big){
  if (!it.esitoRTxt) return "";
  return `<div class="res ${esitoCls(it)} ${big ? "big" : ""}"><span class="k">${big ? "Trade chiuso" + (it.chiusura ? " il " + esc(it.chiusura) : "") + " · Esito" : "Esito del trade"}</span><span class="v">${esitoTxt(it)}</span></div>`;
}
function flagTag(it){
  if (it.status === "TERMINATA" && it.esitoRTxt) return "";
  if (it.flags.chiuso) return `<span class="tag st-TERMINATA">TRADE CHIUSO</span>`;
  if (it.flags.trig) return `<span class="tag chip-warn">IN TRADE</span>`;
  if (it.flags.c1) return `<span class="tag chip-warn">1ª CANDELA</span>`;
  return "";
}
const dirHtml = (d, big) => `<span class="dir ${d === "LONG" ? "long" : "short"}">${d === "LONG" ? "▲" : "▼"} ${d}${big ? "" : ""}</span>`;
const CLS_RANK = {"S": 3, "A+": 2, "A": 1};
const clsRank = c => CLS_RANK[c] || 0;
const CLS_INFO = [["S","affidabilità statistica da 80 in su"],["A+","affidabilità statistica da 60 a 79"],["A","affidabilità statistica da 40 a 59"]];
function clsTip(c){
  return `<span class="ctip" role="tooltip"><b>Cosa indica la classe</b><ul>${CLS_INFO.map(([k, t]) => `<li class="${k === c ? "on" : ""}">Classe ${k} · ${t}</li>`).join("")}</ul><p>L'affidabilità va da 40 a 95 e si basa su win rate e rendimento rispetto al drawdown della stagionalità negli ultimi 10 e 20 anni. Sono solo statistiche basate sul passato: non sono una garanzia di risultati futuri.</p></span>`;
}
const clsHover = (inner, c) => `<span class="cwrap" tabindex="0" aria-label="Classe ${c ? esc(c) : "n.d."}: spiegazione">${inner}${clsTip(c)}</span>`;
function clsBig(c, size){
  const k = c === "S" ? "cls-S" : c === "A+" ? "cls-Ap" : "cls-A";
  return `<div class="cbig ${k}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * (c && c.length > 1 ? .36 : .44))}px" role="img" aria-label="Classe ${c ? esc(c) : "n.d."}">${c ? esc(c) : "—"}${size > 100 ? "<small>CLASSE</small>" : ""}</div>`;
}
function barChart(years){
  const ys = years.slice().sort((a, b) => a.y - b.y);
  const W = 640, H = 260, L = 44, R = 10, T = 30, B = 56;
  const max = Math.max(2, ...ys.map(y => y.r || 0)), min = Math.min(-1, ...ys.map(y => y.r || 0));
  const pw = W - L - R, ph = H - T - B;
  const Y = v => T + (max - v) / (max - min) * ph;
  const step = pw / ys.length, bw = Math.min(34, step * .6);
  let g = "";
  [-1, 0, 1, 2].filter(v => v >= min && v <= max).forEach(v => {
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/>`;
    g += `<text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--fg-3)">${v > 0 ? "+" : ""}${v}R</text>`;
  });
  ys.forEach((y, k) => {
    const cx = L + step * k + step / 2;
    g += `<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--fg-2)">${y.y}</text>`;
    if (y.r == null){
      g += `<text x="${cx}" y="${Y(0)-6}" text-anchor="middle" font-size="11" fill="var(--fg-3)">–</text>`;
      return;
    }
    const y0 = Y(0), y1 = Y(y.r), top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0));
    const col = y.r > 0 ? "var(--long)" : y.r < 0 ? "var(--short)" : "var(--fg-3)";
    g += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col}"><title>${y.y}: ${fmtR(y.r)}</title></rect>`;
    const ly = y.r >= 0 ? top - 7 : top + h + 15;
    g += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${fmtR(y.r)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risultato del backtest anno per anno, in R">${g}</svg>`;
}

/* ---------- filtri del Radar ---------- */
const TIPI = ["Azioni", "Indici", "Materie prime", "Criptovalute"];
const nv = x => x == null || isNaN(x) ? -1e9 : x;
const byStart = (a, b) => (a.start || 0) - (b.start || 0);
const SORTS = {
  classe: (a, b) => clsRank(b.classe) - clsRank(a.classe) || byStart(a, b),
  inizio: (a, b) => byStart(a, b) || clsRank(b.classe) - clsRank(a.classe),
  wr: (a, b) => nv(b.bt.wr) - nv(a.bt.wr) || clsRank(b.classe) - clsRank(a.classe),
  exp: (a, b) => nv(b.bt.exp) - nv(a.bt.exp) || clsRank(b.classe) - clsRank(a.classe),
  score: (a, b) => nv(b.bt.score) - nv(a.bt.score) || clsRank(b.classe) - clsRank(a.classe)
};
const nFiltri = () => ["dir", "tipo", "wrMin", "expMin", "entro"].filter(k => S.f[k]).length + (S.f.classi.length ? 1 : 0);
function filtra(items){
  const f = S.f, q = f.q.trim().toLowerCase();
  const today = new Date(); today.setHours(0,0,0,0);
  return items.filter(i =>
      (f.status === "TUTTI" || i.status === f.status) &&
      (!f.classi.length || f.classi.includes(i.classe)) &&
      (!f.dir || i.dir === f.dir) &&
      (!f.tipo || i.tipo === f.tipo) &&
      (!f.wrMin || (i.bt.wr != null && i.bt.wr >= +f.wrMin)) &&
      (!f.expMin || (i.bt.exp != null && (f.expMin === "0" ? i.bt.exp > 0 : i.bt.exp >= +f.expMin))) &&
      (!f.entro || (i.start && i.start >= today && (i.start - today) / 864e5 <= +f.entro)) &&
      (!q || (i.asset + " " + i.nome).toLowerCase().includes(q)))
    .sort(SORTS[f.sort] || SORTS.classe);
}
function filterPanel(items){
  const f = S.f;
  const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? "selected" : ""}>${label}</option>`;
  const sel = (key, label, opts) => `<label class="fgrp"><span>${label}</span><select class="sel" data-f="${key}">${opts.map(([v, l]) => opt(v, l, f[key])).join("")}</select></label>`;
  const tipi = TIPI.filter(t => items.some(i => i.tipo === t)).concat([...new Set(items.map(i => i.tipo))].filter(t => t && !TIPI.includes(t)));
  return `<div class="fpanel" id="fpanel">
    <div class="fgrp"><span>Classe</span><div class="fchips">${["S","A+","A"].map(c => `<button type="button" class="pill-btn" data-cls="${c}" aria-pressed="${f.classi.includes(c)}">${c}</button>`).join("")}</div></div>
    ${sel("dir", "Direzione", [["", "Tutte"], ["LONG", "Long"], ["SHORT", "Short"]])}
    ${sel("tipo", "Tipo di asset", [["", "Tutti"]].concat(tipi.map(t => [t, t])))}
    ${sel("wrMin", "Win rate backtest", [["", "Qualsiasi"], ["50", "≥ 50%"], ["60", "≥ 60%"], ["70", "≥ 70%"], ["80", "≥ 80%"]])}
    ${sel("expMin", "Expectancy backtest", [["", "Qualsiasi"], ["0", "Positiva (> 0R)"], ["0.5", "≥ 0,5R"], ["1", "≥ 1R"]])}
    ${sel("entro", "Inizio entro", [["", "Qualsiasi"], ["7", "7 giorni"], ["30", "30 giorni"], ["90", "90 giorni"]])}
    ${sel("sort", "Ordina per", [["classe", "Classe"], ["inizio", "Data di inizio"], ["wr", "Win rate backtest"], ["exp", "Expectancy"], ["score", "Score backtest"]])}
    <div class="factions"><button type="button" class="btn" id="freset">Azzera filtri</button></div>
  </div>`;
}

/* Grafico della stagionalità con Lightweight Charts (libreria open source di TradingView):
   candele grigie prima della finestra (tranne la D-1), verdi/rosse dentro, C2 blu,
   ⚠️ sulla 1ª candela opposta, freccia ENTRY sulla C2 e box Risk/Reward (TP verde, SL rosso). */
const LWC_URL = "https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js";
let lwcPromise = null, chNode = null, chKey = null, chChart = null, chNota = "";
const candleCache = {};
function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}
function loadLWC(){
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if (!lwcPromise) lwcPromise = new Promise((ok, ko) => {
    const sc = document.createElement("script");
    sc.src = LWC_URL; sc.async = true;
    sc.onload = () => ok(window.LightweightCharts);
    sc.onerror = () => { lwcPromise = null; ko(new Error("Libreria del grafico non disponibile")); };
    document.head.appendChild(sc);
  });
  return lwcPromise;
}
const isoD = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function addDays(iso, n){ const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoD(d); }

/* Box rettangolare tra due date e due prezzi, disegnato dietro le candele */
class RRBox {
  constructor(t1, t2, p1, p2, fill){ Object.assign(this, {t1, t2, p1, p2, fill}); }
  attached(p){ this.chart = p.chart; this.series = p.series; }
  updateAllViews(){}
  paneViews(){
    const self = this;
    return [{
      zOrder: () => "bottom",
      renderer: () => ({
        draw(target){
          const ts = self.chart.timeScale();
          const x1 = ts.timeToCoordinate(self.t1), x2 = ts.timeToCoordinate(self.t2);
          const y1 = self.series.priceToCoordinate(self.p1), y2 = self.series.priceToCoordinate(self.p2);
          if (x1 == null || x2 == null || y1 == null || y2 == null) return;
          target.useBitmapCoordinateSpace(sc => {
            const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio;
            ctx.fillStyle = self.fill;
            ctx.fillRect(Math.round(Math.min(x1, x2) * hr), Math.round(Math.min(y1, y2) * vr),
              Math.round(Math.abs(x2 - x1) * hr), Math.round(Math.abs(y2 - y1) * vr));
          });
        }
      })
    }];
  }
}

async function fetchCandles(asset, from){
  const k = asset + "|" + from;
  if (candleCache[k]) return candleCache[k];
  const r = await fetch("/api/candles?asset=" + encodeURIComponent(asset) + "&from=" + from);
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
  return (candleCache[k] = j.candles);
}

/* Data del Diario in formato ISO; accetta anche "17/10" senza anno (anno dedotto dalla finestra). */
function isoFin(s, inizio){
  const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if (!m) return "";
  let a = m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : inizio.slice(0, 4);
  const md = String(m[2]).padStart(2, "0") + "-" + String(m[1]).padStart(2, "0");
  if (!m[3] && a + "-" + md < addDays(inizio, -15)) a = String(+a + 1);
  return a + "-" + md;
}

/* Ricostruisce il trade con le regole C2 quando nel Diario mancano le date (trade registrati a mano):
   C2 = due candele contrarie consecutive (la C1 può essere il giorno prima dell'inizio) con la C2 che estende
   il minimo (LONG) / massimo (SHORT) della C1; uscita a TP, SL o fine finestra, coerente con l'Esito R. */
function ricostruisciTrade(cs, inizio, fine, L, avg, esitoR, dC2noto){
  const dentro = c => c.time >= inizio && c.time <= fine;
  const opp = c => L ? c.close < c.open : c.close > c.open;
  const primo = cs.findIndex(dentro);
  if (primo < 0) return null;
  let iE = dC2noto ? cs.findIndex(c => c.time === dC2noto) : -1;
  if (iE < 0){
    for (let i = primo; i < cs.length && dentro(cs[i]); i++){
      const cur = cs[i], prev = cs[i - 1];
      if (prev && (dentro(prev) || i === primo) && opp(prev) && opp(cur) && (L ? cur.low < prev.low : cur.high > prev.high)){ iE = i; break; }
    }
  }
  if (iE < 0) return null;
  const entry = cs[iE].close;
  const tp = L ? entry * (1 + avg / 100) : entry * (1 - avg / 100);
  const sl = L ? entry * (1 - avg / 200) : entry * (1 + avg / 200);
  let iX = -1;
  for (let j = iE + 1; j < cs.length && cs[j].time <= fine; j++){
    const c = cs[j];
    const hitSL = L ? c.low <= sl : c.high >= sl, hitTP = L ? c.high >= tp : c.low <= tp;
    if (esitoR != null && esitoR >= 1.95 && hitTP){ iX = j; break; }
    if (esitoR != null && esitoR <= -0.95 && hitSL){ iX = j; break; }
    if (esitoR != null && Math.abs(esitoR) < 0.05 && c.low <= entry && c.high >= entry){ iX = j; break; } // breakeven
    if (esitoR == null && (hitSL || hitTP)){ iX = j; break; }
  }
  if (iX < 0){ // chiusura a fine finestra
    for (let j = cs.length - 1; j > iE; j--) if (cs[j].time <= fine){ iX = j; break; }
  }
  return {dC1: cs[iE - 1] ? cs[iE - 1].time : "", dC2: cs[iE].time, entry, chiusura: iX > iE ? cs[iX].time : ""};
}

function mountChart(it){
  const slot = document.getElementById("ch-slot");
  if (!slot || !it || !it.start || !it.end) return;
  const key = [it.id, it.c1Date, it.trigDate, it.entry, it.tp, it.sl, it.esitoRTxt, it.chiusura, isDark()].join("|");
  if (chNode && chKey === key){ slot.innerHTML = ""; slot.appendChild(chNode); mostraNota(chNota); return; }
  if (chChart){ try { chChart.remove(); } catch(e){} chChart = null; }
  chKey = key; chNota = "";
  chNode = document.createElement("div");
  chNode.style.height = "100%";
  const inizio = isoD(it.start), fine = isoD(it.end);
  Promise.all([loadLWC(), fetchCandles(it.asset, addDays(inizio, -40))]).then(([LWC, raw]) => {
    if (chKey !== key) return;
    const s2 = document.getElementById("ch-slot");
    if (!s2) return;
    const L = it.dir === "LONG";
    const avg = it.avg;
    const chiuso = it.esitoRTxt !== "";
    let dC1 = isoFin(it.c1Date, inizio), dC2 = isoFin(it.trigDate, inizio), chiusura = isoFin(it.chiusura, inizio);
    let entryRic = null;
    // Trade chiuso ma con date mancanti nel Diario: ricostruzione con le regole C2
    if (chiuso && avg && (!dC2 || !chiusura)){
      const tutte = raw.filter(c => c.time <= fine);
      const rec = ricostruisciTrade(tutte, inizio, fine, L, avg, it.esitoR, dC2);
      if (rec){
        if (!dC2){ dC2 = rec.dC2; entryRic = rec.entry; if (!dC1) dC1 = rec.dC1; }
        if (!chiusura) chiusura = rec.chiusura;
        chNota = "Date del trade non presenti nel Diario: ingresso e chiusura sono ricostruiti con le regole del Metodo C2 e possono differire dal trade reale.";
      }
    }
    // Date nel weekend o in giorni festivi: si usa l'ultima candela disponibile fino a quella data (max 4 giorni prima)
    const aggancia = dt => {
      if (!dt) return "";
      let best = "";
      raw.forEach(c => { if (c.time <= dt && c.time >= addDays(dt, -4)) best = c.time; });
      return best;
    };
    dC1 = aggancia(dC1); dC2 = aggancia(dC2); chiusura = aggancia(chiusura);
    const limite = chiusura || fine;
    const cs = raw.filter(c => c.time <= limite);
    if (cs.length < 2) throw new Error("Dati insufficienti per il grafico");
    const iPrima = cs.findIndex(c => c.time >= inizio);
    const iDm1 = iPrima > 0 ? iPrima - 1 : (iPrima < 0 ? cs.length - 1 : -1);
    const VERDE = "#16a34a", ROSSO = "#dc2626", BLU = "#2563eb", GRIGIO = isDark() ? "#4b5563" : "#c4c9d2";
    const data = cs.map((c, i) => {
      let col = c.close >= c.open ? VERDE : ROSSO;
      if (c.time < inizio && i !== iDm1) col = GRIGIO;
      if (c.time === dC2) col = BLU;
      // Candela del giorno ancora in corso: semitrasparente (non conta per i trigger finché non chiude)
      if (c.live) col = col + "66";
      return Object.assign({}, c, {color: col, wickColor: col, borderColor: col});
    });
    // Trade aperto o finestra in corso: giorni futuri fino alla fine della finestra
    let d = cs[cs.length - 1].time;
    for (let n = 0; n < 60 && d < fine && !chiusura; ){
      d = addDays(d, 1);
      const g = new Date(d + "T12:00:00").getDay();
      if (g === 0 || g === 6) continue;
      data.push({time: d}); n++;
    }
    s2.innerHTML = "";
    s2.appendChild(chNode);
    const dark = isDark();
    const chart = LWC.createChart(chNode, {
      autoSize: true,
      layout: {background: {type: "solid", color: dark ? "#171717" : "#ffffff"}, textColor: dark ? "#d4d4d4" : "#334155", fontFamily: "inherit"},
      grid: {vertLines: {color: dark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)"}, horzLines: {color: dark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)"}},
      rightPriceScale: {borderVisible: false, scaleMargins: {top: 0.1, bottom: 0.1}},
      timeScale: {borderVisible: false, rightOffset: 2},
      localization: {locale: "it-IT", dateFormat: "dd/MM/yyyy",
        priceFormatter: p => p.toLocaleString("it-IT", {minimumFractionDigits: p < 10 ? 3 : 2, maximumFractionDigits: p < 10 ? 3 : 2})},
      crosshair: {mode: 0}
    });
    chChart = chart;
    const series = chart.addCandlestickSeries({priceLineVisible: false, lastValueVisible: !chiusura});
    series.setData(data);

    const markers = [];
    if (dC1 && cs.some(c => c.time === dC1))
      markers.push({time: dC1, position: L ? "belowBar" : "aboveBar", color: "#f59e0b", shape: "circle", text: "⚠️ 1ª opposta"});
    const cC2 = dC2 ? cs.find(c => c.time === dC2) : null;
    if (cC2){
      markers.push({time: dC2, position: L ? "belowBar" : "aboveBar", color: BLU, shape: L ? "arrowUp" : "arrowDown", text: "ENTRY"});
      // Livelli dal Diario, con controllo di coerenza ("29.367" senza decimali è ambiguo)
      const vicino = (v, atteso, tol) => v && atteso && Math.abs(v / atteso - 1) <= tol ? v : atteso;
      const entry = entryRic || vicino(num(it.entry), cC2.close, 0.2);
      const tp = avg ? vicino(num(it.tp), L ? entry * (1 + avg / 100) : entry * (1 - avg / 100), 0.02) : num(it.tp);
      const sl = avg ? vicino(num(it.sl), L ? entry * (1 - avg / 200) : entry * (1 + avg / 200), 0.02) : num(it.sl);
      if (tp && sl){
        series.applyOptions({autoscaleInfoProvider: orig => {
          const r = orig();
          if (!r || !r.priceRange) return r;
          const pr = r.priceRange;
          return Object.assign({}, r, {priceRange: {minValue: Math.min(pr.minValue, tp, sl), maxValue: Math.max(pr.maxValue, tp, sl)}});
        }});
        const fineBox = data[data.length - 1].time;
        series.attachPrimitive(new RRBox(dC2, fineBox, entry, tp, "rgba(22,163,74,0.16)"));
        series.attachPrimitive(new RRBox(dC2, fineBox, entry, sl, "rgba(220,38,38,0.16)"));
        const pctTxt = x => x.toLocaleString("it-IT", {maximumFractionDigits: 2}) + "%";
        series.createPriceLine({price: tp, color: VERDE, lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
          title: "TP " + (L ? "+" : "−") + (avg ? pctTxt(avg) : "")});
        series.createPriceLine({price: sl, color: ROSSO, lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
          title: "SL " + (L ? "−" : "+") + (avg ? pctTxt(avg / 2) : "")});
        series.createPriceLine({price: entry, color: dark ? "#cbd5e1" : "#334155", lineWidth: 1, lineStyle: 0, axisLabelVisible: true,
          title: "Entry · R:R 1:2"});
        // Chiusura del trade: bandierina con l'esito e linea del prezzo di uscita
        if (chiuso && chiusura && cs.some(c => c.time === chiusura)){
          const R = it.esitoR;
          const tipo = R == null ? "Chiuso" : R >= 1.95 ? "TP" : R <= -0.95 ? "SL" : Math.abs(R) < 0.05 ? "BE" : "Chiusura";
          const col = R == null || Math.abs(R) < 0.05 ? (dark ? "#d4d4d4" : "#475569") : R > 0 ? VERDE : ROSSO;
          const rTxt = R == null ? "" : " " + (R > 0 ? "+" : R < 0 ? "−" : "") + Math.abs(R).toLocaleString("it-IT", {maximumFractionDigits: 2}) + "R";
          const favore = R == null || R >= 0;
          markers.push({time: chiusura, position: (L === favore) ? "aboveBar" : "belowBar", color: col, shape: "square", text: "🏁 " + tipo + rTxt});
          if (R != null && avg){
            const uscita = tipo === "TP" ? tp : tipo === "SL" ? sl : tipo === "BE" ? entry
              : (L ? entry * (1 + R * avg / 200) : entry * (1 - R * avg / 200));
            series.createPriceLine({price: uscita, color: col, lineWidth: 2, lineStyle: 1, axisLabelVisible: true, title: "Uscita " + tipo});
          }
        }
      }
    }
    markers.sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
    series.setMarkers(markers);
    const iStart = Math.max(0, (iPrima < 0 ? cs.length : iPrima) - 15);
    // Trade chiuso: spazio a destra per l'etichetta di chiusura
    chart.timeScale().setVisibleLogicalRange({from: iStart - 0.5, to: data.length + (chiusura ? 5 : 1)});
    mostraNota(chNota);
  }).catch(err => {
    if (chKey !== key) return;
    const m = document.getElementById("ch-msg");
    if (m) m.textContent = "Grafico non disponibile al momento (" + err.message + ").";
    chNode = null; chKey = null;
  });
}
function mostraNota(t){
  const n = document.getElementById("ch-nota");
  if (n){ n.textContent = t || ""; n.hidden = !t; }
}

function route(){
  const path = location.pathname.replace(/\/+$/, "") || "/";
  const items = build();
  const app = document.getElementById("app");
  let html, nav = "home";
  const m = path.match(/^\/dettaglio\/([^/]+)$/);
  const ac = path.match(/^\/academy(?:\/([^/]+))?$/);
  if (m){ html = viewDetail(items, decodeURIComponent(m[1])); nav = ""; }
  else if (ac){ html = viewAcademy(ac[1] ? decodeURIComponent(ac[1]) : ""); nav = "ac"; }
  else if (path === "/radar"){ html = viewRadar(items); nav = "radar"; }
  else if (path === "/calendario"){ html = viewCalendar(items); nav = "cal"; }
  else html = viewHome(items);
  const keepFocus = document.activeElement && document.activeElement.id === "q";
  const pos = keepFocus ? document.activeElement.selectionStart : null;
  if (chNode && chNode.parentNode) chNode.parentNode.removeChild(chNode);
  app.innerHTML = html;
  mountChart(m ? items.find(i => i.id === decodeURIComponent(m[1])) : null);
  document.getElementById("nav-home").setAttribute("aria-current", nav === "home" ? "page" : "false");
  document.getElementById("nav-radar").setAttribute("aria-current", nav === "radar" ? "page" : "false");
  document.getElementById("nav-cal").setAttribute("aria-current", nav === "cal" ? "page" : "false");
  document.getElementById("nav-ac").setAttribute("aria-current", nav === "ac" ? "page" : "false");
  const it = m ? items.find(i => i.id === decodeURIComponent(m[1])) : null;
  document.title = it ? (it.nome || it.asset) + " · Stagionalità Senza Stress" : nav === "cal" ? "Calendario · Stagionalità Senza Stress" : nav === "ac" ? "Academy · Stagionalità Senza Stress" : nav === "radar" ? "Radar · Stagionalità Senza Stress" : "Stagionalità Senza Stress";
  if (keepFocus){ const q = document.getElementById("q"); if (q){ q.focus(); try{ q.setSelectionRange(pos, pos); }catch(e){} } }
}
function go(href){
  if (href === location.pathname) { route(); return; }
  history.pushState(null, "", href);
  route(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", route);

function saveF(){ try { const o = {}; Object.keys(F_DEF).forEach(k => o[k] = S.f[k]); localStorage.setItem("sss-filters-v3", JSON.stringify(o)); } catch(e) {} }
document.addEventListener("click", e => {
  const st = e.target.closest("[data-st]");
  if (st){ S.f.status = st.dataset.st; saveF(); go("/radar"); return; }
  if (e.target.closest("#refresh")){ load(true); return; }
  if (e.target.closest("#ftoggle")){ S.fOpen = !S.fOpen; route(); return; }
  const cls = e.target.closest("[data-cls]");
  if (cls){ const c = cls.dataset.cls; S.f.classi = S.f.classi.includes(c) ? S.f.classi.filter(x => x !== c) : S.f.classi.concat(c); saveF(); route(); return; }
  if (e.target.closest("#freset")){ Object.keys(F_DEF).forEach(k => S.f[k] = Array.isArray(F_DEF[k]) ? [] : F_DEF[k]); S.f.q = ""; saveF(); route(); return; }
  const a = e.target.closest("a[href^='/']");
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0 && a.target !== "_blank"){ e.preventDefault(); const href = a.getAttribute("href"); if (href === "/radar" && !a.classList.contains("back")) S.f.status = "ATTIVA"; go(href); }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ S.f.q = e.target.value; route(); } });
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (!k) return;
  S.f[k] = e.target.value;
  // "Inizio entro" riguarda le finestre non ancora partite: passa allo stato "In arrivo"
  if (k === "entro" && S.f.entro && (S.f.status === "ATTIVA" || S.f.status === "TERMINATA")) S.f.status = "IN ARRIVO";
  saveF(); route();
});

/* ---------- data: /api/data legge il Diario Trade e il Calendario dal foglio ---------- */
let busy = false;
async function load(fresh){
  if (busy) return; busy = true;
  try {
    const r = await fetch(API + (fresh ? "?fresh=" + Date.now() : ""), {cache: fresh ? "no-store" : "default"});
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
    S.diario = j.diario; S.cal = j.cal; S.updatedAt = j.updatedAt; S.error = null;
  } catch(err){
    S.error = {html: S.diario
      ? "Non sono riuscito ad aggiornare i dati: stai vedendo l'ultima versione caricata."
      : "Non è stato possibile caricare le stagionalità. Riprova tra qualche istante.",
      action: `<button class="btn" id="refresh" type="button">Riprova</button>`};
  } finally { busy = false; S.loading = false; route(); }
}
route();
load(false);
setInterval(() => { if (!document.hidden) load(false); }, 300000);
})();
