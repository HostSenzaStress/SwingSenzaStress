<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stagionalità finanziarie ordinate per affidabilità statistica, con il backtest del Metodo C2. Non è un servizio di segnali di trading.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Stagionalità Senza Stress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
/* Layout: header sottile + contenuto a colonna unica (max 1120px); card a griglia; dettaglio con tre numeri chiave in alto. Palette e font ripresi da Forecaster Terminal. */
:root{
  --bg:#ffffff; --surface:#ffffff; --muted:#f5f7fa; --border:#e5e5e5;
  --fg:#09090b; --fg-2:#3f4a5c; --fg-3:#737373;
  --navy:#1e2d4d; --navy-2:#263f5f; --navy-3:#2e4f6f; --blue:#549be2; --blue-2:#68aaed; --blue-soft:#eff7ff;
  --hero-fg:#ffffff; --hero-sub:#c9d8ec; --brand:#1e2d4d; --heading:#2e4f6f;
  --long:#15803d; --long-soft:#ecfdf3; --long-line:#bbf0cf;
  --short:#c2121f; --short-soft:#fff1f2; --short-line:#fecdd3;
  --warn:#c2410c; --warn-soft:#fff7ed;
  --font:"Roboto Flex","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:.625rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#171717; --muted:#202226; --border:#ffffff1a;
  --fg:#fafafa; --fg-2:#c8ced8; --fg-3:#a1a1a1;
  --navy:#1a2740; --navy-2:#24364f; --navy-3:#2e4f6f; --blue:#68aaed; --blue-2:#8cc0f3; --blue-soft:#14243a;
  --hero-fg:#ffffff; --hero-sub:#a9bdd6; --brand:#fafafa; --heading:#8cc0f3;
  --long:#4ade80; --long-soft:#0d2a1a; --long-line:#1f5c37;
  --short:#ff6b74; --short-soft:#32121a; --short-line:#6b2230;
  --warn:#fb923c; --warn-soft:#2f1a0c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#171717; --muted:#202226; --border:#ffffff1a;
  --fg:#fafafa; --fg-2:#c8ced8; --fg-3:#a1a1a1;
  --navy:#1a2740; --navy-2:#24364f; --navy-3:#2e4f6f; --blue:#68aaed; --blue-2:#8cc0f3; --blue-soft:#14243a;
  --hero-fg:#ffffff; --hero-sub:#a9bdd6; --brand:#fafafa; --heading:#8cc0f3;
  --long:#4ade80; --long-soft:#0d2a1a; --long-line:#1f5c37;
  --short:#ff6b74; --short-soft:#32121a; --short-line:#6b2230;
  --warn:#fb923c; --warn-soft:#2f1a0c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em;font-stretch:112%;color:var(--brand);white-space:nowrap}
@media (max-width:520px){.brand{flex:1}.brand-name{font-size:15px;white-space:normal;line-height:1.15;display:block}.brand-sub{display:none}.nav a{padding:6px 10px}}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.nav{display:flex;gap:6px}
.nav a{padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--fg-2)}
.nav a:hover{background:var(--muted)}
.nav a[aria-current="page"]{background:var(--blue-2);color:#fff}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:24px}

/* Hero */
.hero{background:var(--navy);color:var(--hero-fg);border-radius:calc(var(--radius)*1.6);padding:28px;display:grid;gap:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.hero .eyebrow{color:var(--blue-2)}
.hero h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.12;font-weight:700;font-stretch:110%;letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
.hero p{margin:0;color:var(--hero-sub);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--navy-2);border:1px solid #ffffff1f;border-radius:var(--radius);padding:12px 14px;text-align:left;cursor:pointer;color:var(--hero-fg)}
.tile:hover{border-color:var(--blue-2)}
.tile[aria-pressed="true"]{border-color:var(--blue-2);box-shadow:inset 0 0 0 1px var(--blue-2)}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-sub)}
.tile .v{font-size:28px;font-weight:700;line-height:1.1}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 14px;background:var(--surface)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;color:var(--fg-2)}
.pill-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
select.sel{border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--blue)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.updated{font-size:12px;color:var(--fg-3)}

/* Badges */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);white-space:nowrap}
.cls-S{background:var(--navy);color:#fff;border-color:var(--navy)}
.cls-Ap{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.cls-A{background:var(--muted);color:var(--fg-2);border-color:transparent}
.st-ATTIVA{background:var(--long-soft);color:var(--long);border-color:var(--long-line)}
.st-ARRIVO{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.st-TERMINATA{background:var(--muted);color:var(--fg-3);border-color:transparent}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dir{display:inline-flex;align-items:center;gap:5px;font-weight:700;letter-spacing:.03em}
.dir.long{color:var(--long)} .dir.short{color:var(--short)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);padding:16px;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--blue-2);transform:translateY(-1px)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.asset-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.asset{font-size:18px;font-weight:700;font-stretch:108%}
.tk{font-size:13px;font-weight:500;color:var(--fg-3)}
.sub{font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--muted);border-radius:var(--radius);padding:8px 10px}
.kpi .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.kpi .v{font-size:17px;font-weight:700}
.bar{height:6px;background:var(--muted);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue-2);border-radius:99px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-3);margin-bottom:5px}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:1px solid var(--border);padding-top:10px;color:var(--fg-3)}
.card-foot b{color:var(--fg)}
.card-foot .go{color:var(--blue);font-weight:600}

/* Classe statistica (badge grande) */
.cbig{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);font-weight:800;line-height:1;font-stretch:112%;letter-spacing:-.02em}
.cbig small{font-size:10px;letter-spacing:.12em;font-weight:600;margin-top:6px;opacity:.8}
.cbig.cls-S{background:var(--navy);color:#fff}
.cbig.cls-Ap{background:var(--blue-soft);color:var(--blue)}
.cbig.cls-A{background:var(--muted);color:var(--fg-2)}

/* States */
.notice{border:1px solid var(--border);background:var(--muted);border-radius:var(--radius);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.notice p{margin:0;max-width:70ch}
.notice.err{background:var(--short-soft);border-color:var(--short-line)}
.empty{color:var(--fg-3);text-align:center;padding:32px 0}
.skel{height:190px;border-radius:calc(var(--radius)*1.4);background:linear-gradient(90deg,var(--muted),var(--surface),var(--muted));background-size:200% 100%;animation:sh 1.4s linear infinite;border:1px solid var(--border)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.card{transition:none}}

/* Detail */
.back{color:var(--blue);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.dhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dhead h1{margin:0;font-size:clamp(28px,4.4vw,42px);font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1}
.dhead .nm{color:var(--fg-3);font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px}
.key{border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);padding:20px 22px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.key .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.key.dir-long{background:var(--long-soft);border-color:var(--long-line)}
.key.dir-short{background:var(--short-soft);border-color:var(--short-line)}
.big-dir{font-size:clamp(38px,6vw,60px);font-weight:900;font-stretch:118%;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:10px}
.big-avg{font-size:clamp(38px,6vw,60px);font-weight:800;line-height:1;letter-spacing:-.02em}
.key .s{font-size:13px;color:var(--fg-2)}
.c-long{color:var(--long)} .c-short{color:var(--short)}
.period{display:grid;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.period .prow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg-2)}
@media (max-width:760px){.keys{grid-template-columns:1fr 1fr}.keys .key-score{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}}
@media (max-width:420px){.keys{grid-template-columns:1fr}}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--heading);font-weight:700}
.sec-h .hint{font-size:13px;color:var(--fg-3)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mini{background:var(--muted);border-radius:var(--radius);padding:8px 12px}
.mini .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.mini .v{font-size:15px;font-weight:700}
.mini .v.neg{color:var(--short)}
.mini .ms{font-size:11.5px;color:var(--fg-3)}
.minis.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.minis.m4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{font-size:13px;color:var(--fg-3);margin:0;max-width:90ch}

/* Backtest */
.bt{border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);overflow:hidden;background:var(--surface)}
.bt-head{background:var(--navy);color:var(--hero-fg);padding:22px;display:grid;gap:12px}
.bt-wr .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-sub);font-weight:600}
.bt-wr .v{font-size:clamp(52px,9vw,80px);font-weight:900;font-stretch:115%;line-height:1}
.bt-wr .s{font-size:13px;color:var(--hero-sub)}
.bt-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;max-width:820px;margin:0 auto;min-width:480px;height:auto}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{border-left:3px solid var(--blue-2);padding:2px 0 2px 12px;font-size:13.5px;color:var(--fg-2)}
.rule b{display:block;color:var(--fg);font-size:13px;letter-spacing:.04em;text-transform:uppercase}

/* Trade steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px}
.step.on .dot{background:var(--long);border-color:var(--long);color:#fff}
.step b{display:block;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.step span{font-size:13.5px;color:var(--fg-3)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* Calendar */
.cal-hero{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);padding:18px 20px}
.cal-hero h1{margin:0;font-size:26px;font-weight:800;font-stretch:110%}
.cal-hero p{margin:0;color:var(--fg-3)}
.month{display:flex;flex-direction:column;gap:8px}
.month-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.month-h::after{content:"";flex:1;height:1px;background:var(--border)}
.row{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
.row:hover{border-color:var(--blue-2)}
.date{flex:none;width:52px;text-align:center;border-radius:8px;background:var(--blue-soft);padding:6px 0;line-height:1.1}
.date small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
.date b{font-size:20px}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--fg-3);align-items:center}
.row .sc{flex:none;text-align:right;font-size:12px;color:var(--fg-3)}
.row .sc b{display:block;font-size:20px;color:var(--fg)}

.tv-slot{height:clamp(380px,62vh,620px);border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);overflow:hidden;background:var(--surface)}
.tv-slot>div{height:100%}
.disc{border-top:1px solid var(--border);padding-top:18px;font-size:13px;color:var(--fg-3)}
.disc b{color:var(--fg-2)}
.disc p{margin:4px 0 0;max-width:90ch}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/" aria-label="Stagionalità Senza Stress, home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="9" fill="var(--navy)"/>
        <path d="M7 22 C11 22 12 12 17 12 S23 20 27 11" fill="none" stroke="var(--blue-2)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="27" cy="11" r="2.4" fill="#ffffff"/>
      </svg>
      <span>
        <span class="brand-name">Stagionalità Senza Stress</span><br>
        <span class="brand-sub">Swing meccanico stagionale</span>
      </span>
    </a>
    <nav class="nav" aria-label="Sezioni">
      <a href="/" id="nav-home">Home</a>
      <a href="/calendario" id="nav-cal">Calendario</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";
const API = "/api/data";
/* Simboli TradingView: aggiungi qui gli asset nuovi (nome come nella colonna "Asset" del diario). */
const TV_SYMBOLS = {
  "AAPL":"NASDAQ:AAPL","AMZN":"NASDAQ:AMZN","AVGO":"NASDAQ:AVGO","GOOG":"NASDAQ:GOOG","GOOGL":"NASDAQ:GOOGL",
  "META":"NASDAQ:META","MSFT":"NASDAQ:MSFT","NVDA":"NASDAQ:NVDA","TSLA":"NASDAQ:TSLA","MU":"NASDAQ:MU",
  "XAUUSD":"OANDA:XAUUSD","XAGUSD":"OANDA:XAGUSD","GOLD":"OANDA:XAUUSD","SILVER":"OANDA:XAGUSD",
  "PLATINUM":"NYMEX:PL1!","PLUSD":"NYMEX:PL1!","PALLADIUM":"NYMEX:PA1!","PAUSD":"NYMEX:PA1!",
  "HGUSD":"COMEX:HG1!","COPPER":"COMEX:HG1!","CLUSD":"NYMEX:CL1!","CRUDE OIL":"NYMEX:CL1!",
  "NGUSD":"NYMEX:NG1!","NATURAL GAS":"NYMEX:NG1!","ZCUSX":"CBOT:ZC1!","CORN":"CBOT:ZC1!",
  "ZSUSX":"CBOT:ZS1!","SOYBEAN":"CBOT:ZS1!","KEUSX":"CBOT:KE1!","ZWUSX":"CBOT:ZW1!",
  "COCOA":"ICEUS:CC1!","SUGAR":"ICEUS:SB1!","COFFEE":"ICEUS:KC1!",
  "SBUSX":"ICEUS:SB1!","KCUSX":"ICEUS:KC1!","CCUSX":"ICEUS:CC1!","CTUSX":"ICEUS:CT1!","OJUSX":"ICEUS:OJ1!",
  "S&P 500":"SP:SPX","SPX":"SP:SPX","NASDAQ 100":"NASDAQ:NDX","NDX":"NASDAQ:NDX","DAX 40":"XETR:DAX","DAX":"XETR:DAX",
  "^GSPC":"SP:SPX","^NDX":"NASDAQ:NDX","^GDAXI":"XETR:DAX",
  "BTCUSD":"BITSTAMP:BTCUSD","ETHUSD":"BITSTAMP:ETHUSD"
};
function tvSymbol(asset){
  const a = String(asset || "").trim().toUpperCase();
  if (TV_SYMBOLS[a]) return TV_SYMBOLS[a];
  const fx = a.match(/^([A-Z]{3})\/?([A-Z]{3})$/);
  if (fx && !/^(XAU|XAG)/.test(a)) return "FX:" + fx[1] + fx[2];
  return a.replace(/\s+/g, "");
}
const STRATEGY = "Metodo C2";
const STRATEGY_LONG = "Metodo C2 · Doppia candela contraria";

const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MESI_L = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

const S = {
  diario: null, cal: null, loading: true, error: null, mcp: undefined,
  updatedAt: null,
  f: {status: "ATTIVA", classe: "", q: ""}
};
try { const saved = JSON.parse(localStorage.getItem("sss-filters-v2") || "null"); if (saved && saved.classe) S.f.classe = saved.classe; } catch(e) {}

/* ---------- parsing ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(v){
  if (v == null) return null;
  let s = String(v).trim();
  if (!s) return null;
  if (s.includes("∞")) return Infinity;
  s = s.replace(/[%Rx\s]/g, "").replace(/^\+/, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function pdate(s){
  const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
const truthy = v => v === true || String(v).toUpperCase() === "TRUE";
const fmtPct = (n, d=1) => n == null ? "—" : n === Infinity ? "∞" : n.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const fmtN = (n, d=2) => n == null ? "—" : n === Infinity ? "∞" : n.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtR = n => n == null ? "—" : (n > 0 ? "+" : "") + n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}) + "R";
const dShort = d => d ? d.getDate().toString().padStart(2,"0") + " " + MESI[d.getMonth()] : "—";
const dLong = d => d ? d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";

function wrWindow(years, n){
  const i = years.findIndex(y => y.r != null);
  if (i < 0) return null;
  const win = years.slice(i, i + n);
  const trades = win.filter(y => y.r != null);
  const wins = trades.filter(y => y.r > 0).length;
  return {pct: trades.length ? wins / trades.length * 100 : null, wins, n: trades.length,
          from: win[win.length-1].y, to: win[0].y};
}

function build(){
  if (!S.diario) return [];
  const rows = S.diario;
  const head = (rows[0] || []).map(h => String(h || "").trim());
  const ix = {}; head.forEach((h, i) => { if (h && !(h in ix)) ix[h] = i; });
  const yearCols = head.map((h, i) => { const m = h.match(/^(\d{4})\s*\(R\)$/); return m ? {y: +m[1], i} : null; })
                       .filter(Boolean).sort((a, b) => b.y - a.y);
  const calMap = {};
  if (S.cal && S.cal.length){
    let hr = S.cal.findIndex(r => r.some(c => String(c).trim() === "ID"));
    if (hr >= 0){
      const ch = S.cal[hr].map(h => String(h || "").trim());
      const ci = n => ch.indexOf(n);
      S.cal.slice(hr + 1).forEach(r => {
        const id = String(r[ci("ID")] || "").trim();
        if (!id) return;
        calMap[id] = {c1: truthy(r[ci("Prima candela opposta")]), trig: truthy(r[ci("Trigger confermato")]), chiuso: truthy(r[ci("Chiuso")])};
      });
    }
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  rows.slice(1).forEach(r => {
    const g = h => ix[h] == null ? "" : r[ix[h]];
    const id = String(g("ID") || "").trim();
    const asset = String(g("Asset") || "").trim();
    if (!id || !asset) return;
    if (/^NO/i.test(String(g("PUBBLICA SUL SITO") || "").trim())) return; // short e forex restano solo nel diario
    const periodo = String(g("Periodo stagionale") || "");
    const parts = periodo.split("-").map(s => s.trim());
    const start = pdate(parts[0]), end = pdate(parts[1]);
    let status = "IN ARRIVO", progress = 0;
    if (start && end){
      if (today > end){ status = "TERMINATA"; progress = 100; }
      else if (today >= start){ status = "ATTIVA"; progress = Math.max(0, Math.min(100, (today - start) / (end - start) * 100)); }
    }
    const years = yearCols.map(c => ({y: c.y, r: num(r[c.i])}));
    const cal = calMap[id] || {c1:false, trig:false, chiuso:false};
    const esito = String(g("ESITO (WIN/LOSS/BE)") || "").trim();
    out.push({
      id, asset, nome: String(g("Nome") || "").trim(), periodo, start, end, status, progress,
      dir: String(g("Direzione") || "").toUpperCase().includes("SHORT") ? "SHORT" : "LONG",
      avg: num(g("AVG Medio")), wr10: num(g("WR 10Y")), wr20: num(g("WR 20Y")),
      avg10: num(g("AVG 10Y")), avg20: num(g("AVG 20Y")), avgOpp: num(g("AVG Opposto")),
      ddMed: num(g("DD Medio")), ddMin: num(g("DD Min")), ddMax: num(g("DD Max")),
      avgRatio: num(g("AVG Ratio")), vp: num(g("Rapporto V/P Medio")),
      classe: String(g("Classe") || "").trim(),
      trigDate: String(g("Data Trigger") || "").trim(), entry: String(g("Entry") || "").trim(),
      tp: String(g("TP") || "").trim(), sl: String(g("SL") || "").trim(), rr: num(g("R:R")),
      esitoR: num(g("Esito R")), chiusura: String(g("Data Chiusura") || "").trim(), esito,
      durata: num(g("Durata Stagionalità")),
      note: String(g("Note") || "").trim(),
      bt: {
        wr: num(g("WR backtest (trade chiusi)")), exp: num(g("Expectancy (R medio per trade)")),
        pf: num(g("Profit Factor (R vinti / R persi)")), score: num(g("SCORE BACKTEST (0-100)")),
        prio: String(g("PRIORITÀ BACKTEST (da score)") || "").trim(),
        years, wr5: wrWindow(years, 5), wr10: wrWindow(years, 10)
      },
      flags: {c1: cal.c1, trig: cal.trig || !!String(g("Entry")||"").trim(), chiuso: cal.chiuso || !!esito}
    });
  });
  return out;
}

/* ---------- small components ---------- */
const clsTag = c => c ? `<span class="tag ${c === "S" ? "cls-S" : c === "A+" ? "cls-Ap" : "cls-A"}" title="Classe statistica">${esc(c === "S" || c.startsWith("A") ? "Classe " + c : c)}</span>` : "";
const stTag = s => `<span class="tag ${s === "ATTIVA" ? "st-ATTIVA" : s === "TERMINATA" ? "st-TERMINATA" : "st-ARRIVO"}">${s}</span>`;
function flagTag(it){
  if (it.flags.chiuso) return `<span class="tag st-TERMINATA">TRADE CHIUSO</span>`;
  if (it.flags.trig) return `<span class="tag chip-warn">IN TRADE</span>`;
  if (it.flags.c1) return `<span class="tag chip-warn">1ª CANDELA</span>`;
  return "";
}
const dirHtml = (d, big) => `<span class="dir ${d === "LONG" ? "long" : "short"}">${d === "LONG" ? "▲" : "▼"} ${d}${big ? "" : ""}</span>`;
const CLS_RANK = {"S": 3, "A+": 2, "A": 1};
const clsRank = c => CLS_RANK[c] || 0;
function clsBig(c, size){
  const k = c === "S" ? "cls-S" : c === "A+" ? "cls-Ap" : "cls-A";
  return `<div class="cbig ${k}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * (c && c.length > 1 ? .36 : .44))}px" role="img" aria-label="Classe ${c ? esc(c) : "n.d."}">${c ? esc(c) : "—"}${size > 100 ? "<small>CLASSE</small>" : ""}</div>`;
}
function barChart(years){
  const ys = years.slice().sort((a, b) => a.y - b.y);
  const W = 640, H = 260, L = 44, R = 10, T = 30, B = 56;
  const max = Math.max(2, ...ys.map(y => y.r || 0)), min = Math.min(-1, ...ys.map(y => y.r || 0));
  const pw = W - L - R, ph = H - T - B;
  const Y = v => T + (max - v) / (max - min) * ph;
  const step = pw / ys.length, bw = Math.min(34, step * .6);
  let g = "";
  [-1, 0, 1, 2].filter(v => v >= min && v <= max).forEach(v => {
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/>`;
    g += `<text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--fg-3)">${v > 0 ? "+" : ""}${v}R</text>`;
  });
  ys.forEach((y, k) => {
    const cx = L + step * k + step / 2;
    g += `<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--fg-2)">${y.y}</text>`;
    if (y.r == null){
      g += `<text x="${cx}" y="${Y(0)-6}" text-anchor="middle" font-size="11" fill="var(--fg-3)">–</text>`;
      return;
    }
    const y0 = Y(0), y1 = Y(y.r), top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0));
    const col = y.r > 0 ? "var(--long)" : y.r < 0 ? "var(--short)" : "var(--fg-3)";
    g += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col}"><title>${y.y}: ${fmtR(y.r)}</title></rect>`;
    const ly = y.r >= 0 ? top - 7 : top + h + 15;
    g += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${fmtR(y.r)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risultato del backtest anno per anno, in R">${g}</svg>`;
}

/* ---------- views ---------- */
function stateNotice(){
  if (S.error) return `<div class="notice err" role="alert"><p>${S.error.html}</p>${S.error.action || ""}</div>`;
  return "";
}
function loadingGrid(){ return `<div class="grid">${'<div class="skel"></div>'.repeat(6)}</div>`; }

  const list = items.filter(i =>
      (S.f.status === "TUTTI" || i.status === S.f.status) &&
      (!S.f.classe || i.classe === S.f.classe) &&
      (!q || (i.asset + " " + i.nome).toLowerCase().includes(q)))
    .sort((a, b) => clsRank(b.classe) - clsRank(a.classe) || (a.start - b.start));
  const tile = (k, label) => `<button class="tile" data-st="${k}" aria-pressed="${S.f.status === k}"><div class="k">${label}</div><div class="v">${S.loading && !S.diario ? "–" : cnt[k]}</div></button>`;

  if (!S.diario) body = S.error ? "" : loadingGrid();
  else if (!list.length) body = `<p class="empty">Nessuna stagionalità corrisponde ai filtri.</p>`;

  return `

    <h1>Le stagionalità ordinate per classe statistica.</h1>
    <p>Tre classi, S, A+ e A, basate su 10 e 20 anni di dati storici, con il backtest del ${STRATEGY} per ogni finestra. Un'operatività swing con regole fisse: pochi minuti al giorno, nessuna decisione presa d'impulso.</p>
    <div class="tiles">${tile("TUTTI","Totale")}${tile("ATTIVA","Attive")}${tile("IN ARRIVO","In arrivo")}${tile("TERMINATA","Terminate")}</div>
  </section>
  ${stateNotice()}
  <div class="toolbar">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="var(--fg-3)" stroke-width="2"/><path d="M20 20l-4-4" stroke="var(--fg-3)" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Cerca asset (es. AAPL, Gold, Corn…)" value="${esc(S.f.q)}" aria-label="Cerca asset"></label>
    <div class="pills">${pill("TUTTI","Tutti")}${pill("IN ARRIVO","In arrivo")}${pill("ATTIVA","Attive")}${pill("TERMINATA","Terminate")}</div>
    <select class="sel" id="classe" aria-label="Filtra per classe">
      <option value="">Tutte le classi</option>${["S","A+","A"].map(c => `<option value="${c}" ${S.f.classe === c ? "selected" : ""}>Classe ${c}</option>`).join("")}
    </select>
    <button class="btn" id="refresh" type="button">↻ Aggiorna</button>
    ${S.updatedAt ? `<span class="updated">Dati del ${new Date(S.updatedAt).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>` : ""}
  </div>
  ${body}
  ${disclaimer()}`;
}

function viewCalendar(items){
  const list = items.slice().filter(i => i.start).sort((a, b) => a.start - b.start || clsRank(b.classe) - clsRank(a.classe));
  const groups = [];
  list.forEach(i => {
    const k = i.start.getFullYear() * 12 + i.start.getMonth();
    let g = groups[groups.length - 1];
    if (!g || g.k !== k){ g = {k, label: MESI_L[i.start.getMonth()] + " " + i.start.getFullYear(), items: []}; groups.push(g); }
    g.items.push(i);
  });
  let body;
  if (!S.diario) body = S.error ? "" : loadingGrid();
  else if (!groups.length) body = `<p class="empty">Nessuna stagionalità nel diario.</p>`;
  else body = groups.map(g => `<section class="month"><div class="month-h">${g.label} <span class="tag cls-Ap">${g.items.length} ${g.items.length === 1 ? "stagionalità" : "stagionalità"}</span></div>
    ${g.items.map(i => `<a class="row" href="/dettaglio/${encodeURIComponent(i.id)}">

      <div class="mid"><div class="asset-line"><span class="asset" style="font-size:16px">${esc(i.nome || i.asset)}</span>${i.nome ? `<span class="tk">${esc(i.asset)}</span>` : ""}${flagTag(i)}</div>
        <div class="meta">${dirHtml(i.dir)}<span>${dShort(i.start)} → ${dShort(i.end)}</span>${stTag(i.status)}<span>AVG <b class="${i.dir === "LONG" ? "c-long" : "c-short"}">${fmtPct(i.avg)}</b></span></div></div>
      <div class="sc">Classe<b>${i.classe ? esc(i.classe) : "—"}</b></div></a>`).join("")}</section>`).join("");
  return `<div class="cal-hero"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="11" fill="var(--navy)"/><rect x="11" y="13" width="22" height="19" rx="3" fill="none" stroke="var(--blue-2)" stroke-width="2"/><path d="M11 19h22M17 10v6M27 10v6" stroke="var(--blue-2)" stroke-width="2" stroke-linecap="round"/></svg>
    <div><h1>Calendario stagionalità</h1><p>Tutte le finestre ordinate per data di inizio.</p></div></div>
    ${stateNotice()}${body}${disclaimer()}`;
}

function disclaimer(){
  return `<footer class="disc"><b>Disclaimer statistico</b><p>Classe, win rate e backtest sono indici calcolati su dati storici. Non sono una probabilità futura, una previsione o un consiglio finanziario, e questa pagina non fornisce segnali di trading.</p></footer>`;
}

/* ---------- router ---------- */
let tvNode = null, tvSym = null;
function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}
function mountTV(){
  const slot = document.getElementById("tv-slot");
  if (!slot) return;
  const sym = slot.dataset.symbol;
  if (tvNode && tvSym === sym){ slot.appendChild(tvNode); return; }
  tvSym = sym;
  tvNode = document.createElement("div");
  tvNode.className = "tradingview-widget-container";
  tvNode.style.height = "100%";
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  inner.style.height = "100%";
  tvNode.appendChild(inner);
  const sc = document.createElement("script");
  sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  sc.async = true;
  sc.text = JSON.stringify({
    autosize: true, symbol: sym, interval: "D", timezone: "Europe/Zurich",
    theme: isDark() ? "dark" : "light", style: "1", locale: "it",
    hide_volume: true, studies: [], hide_side_toolbar: true, hide_top_toolbar: false,
    hide_legend: false, withdateranges: true, allow_symbol_change: true,
    save_image: false, details: false, hotlist: false, calendar: false,
    backgroundColor: isDark() ? "#171717" : "#ffffff",
    gridColor: isDark() ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)",
    support_host: "https://www.tradingview.com"
  });
  tvNode.appendChild(sc);
  slot.appendChild(tvNode);
}
function route(){
  const path = location.pathname.replace(/\/+$/, "") || "/";
  const items = build();
  const app = document.getElementById("app");
  let html, nav = "home";
  const m = path.match(/^\/dettaglio\/([^/]+)$/);
  if (m){ html = viewDetail(items, decodeURIComponent(m[1])); nav = ""; }
  else if (path === "/calendario"){ html = viewCalendar(items); nav = "cal"; }
  else html = viewHome(items);
  const keepFocus = document.activeElement && document.activeElement.id === "q";
  const pos = keepFocus ? document.activeElement.selectionStart : null;
  if (tvNode && tvNode.parentNode) tvNode.parentNode.removeChild(tvNode);
  app.innerHTML = html;
  mountTV();
  document.getElementById("nav-home").setAttribute("aria-current", nav === "home" ? "page" : "false");
  document.getElementById("nav-cal").setAttribute("aria-current", nav === "cal" ? "page" : "false");
  const it = m ? items.find(i => i.id === decodeURIComponent(m[1])) : null;
  document.title = it ? (it.nome || it.asset) + " ·Stagionalità Senza Stress" : nav === "cal" ? "Calendario · Stagionalità Senza Stress" : "Stagionalità Senza Stress";
  if (keepFocus){ const q = document.getElementById("q"); if (q){ q.focus(); try{ q.setSelectionRange(pos, pos); }catch(e){} } }
}
function go(href){
  if (href === location.pathname) { route(); return; }
  history.pushState(null, "", href);
  route(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", route);

function saveF(){ try { localStorage.setItem("sss-filters-v2", JSON.stringify({status: S.f.status, classe: S.f.classe})); } catch(e) {} }
document.addEventListener("click", e => {
  const st = e.target.closest("[data-st]");
  if (st){ S.f.status = st.dataset.st; saveF(); go("/"); return; }
  if (e.target.closest("#refresh")){ load(true); return; }
  const a = e.target.closest("a[href^='/']");
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0 && a.target !== "_blank"){ e.preventDefault(); const href = a.getAttribute("href"); if (href === "/" && !a.classList.contains("back")) S.f.status = "ATTIVA"; go(href); }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ S.f.q = e.target.value; route(); } });
document.addEventListener("change", e => { if (e.target.id === "classe"){ S.f.classe = e.target.value; saveF(); route(); } });

/* ---------- data: /api/data legge il Diario Trade e il Calendario dal foglio ---------- */
let busy = false;
async function load(fresh){
  if (busy) return; busy = true;
  try {
    const r = await fetch(API + (fresh ? "?fresh=" + Date.now() : ""), {cache: fresh ? "no-store" : "default"});
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
    S.diario = j.diario; S.cal = j.cal; S.updatedAt = j.updatedAt; S.error = null;
  } catch(err){
    S.error = {html: S.diario
      ? "Non sono riuscito ad aggiornare i dati: stai vedendo l'ultima versione caricata."
      : "Non è stato possibile caricare le stagionalità. Riprova tra qualche istante.",
      action: `<button class="btn" id="refresh" type="button">Riprova</button>`};
  } finally { busy = false; S.loading = false; route(); }
}
route();
load(false);
setInterval(() => { if (!document.hidden) load(false); }, 300000);
})();
</script>
